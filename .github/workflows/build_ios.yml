name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/**'
    paths:
      - '.github/workflows/build_ios.yml'
      - 'simple_live_app/**'
      - 'simple_live_core/**'

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: simple_live_app

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: simple_live_app/pubspec.yaml
          cache: true

      - name: Set up Rust for iOS
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-ios,aarch64-apple-ios-sim
          rustup default stable

      - name: Verify native Liquid Glass SDK
        run: |
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          test "${sdk_version%%.*}" -ge 26

      - name: Restore Flutter dependencies
        run: flutter pub get

      - name: Run follow-list regression tests
        run: flutter test test/follow_user_controller_test.dart

      - name: Build unsigned iOS application
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          test -d build/ios/iphoneos/Runner.app
          mkdir -p build/ios/package/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/package/Payload/Runner.app
          cd build/ios/package
          zip -q -r ../Slive-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: Slive-iOS-unsigned-${{ github.run_number }}
          path: simple_live_app/build/ios/Slive-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Add download instructions
        run: |
          {
            echo '### iOS build completed'
            echo ''
            echo 'Download the Slive-iOS-unsigned artifact from this workflow run.'
            echo 'The IPA is unsigned and must be signed before installation on an iPhone.'
            echo ''
            echo "Source commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Choose iOS 26+ simulator
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, re, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))['devices']
          candidates = []
          for runtime, entries in devices.items():
              match = re.search(r'\.iOS-(\d+)', runtime)
              if not match or int(match[1]) < 26:
                  continue
              for device in entries:
                  if 'iPhone' in device['name'] and device.get('isAvailable'):
                      candidates.append((int(match[1]) != 26, device['state'] != 'Booted', device['udid'], device['state']))
          if not candidates:
              raise SystemExit('No iOS 26+ iPhone simulator is installed.')
          _, _, udid, state = sorted(candidates)[0]
          print('SIMULATOR_UDID=' + udid)
          print('SIMULATOR_NEEDS_BOOT=' + str(state != 'Booted').lower())
          PY

      - name: Build and launch native dock preview
        run: |
          if [ "$SIMULATOR_NEEDS_BOOT" = true ]; then
            xcrun simctl boot "$SIMULATOR_UDID"
          fi
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          flutter build ios --simulator --debug --target integration_test/native_dock_preview.dart
          xcrun simctl ui "$SIMULATOR_UDID" appearance light
          xcrun simctl install "$SIMULATOR_UDID" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$SIMULATOR_UDID" com.slotsun.slive

      - name: Verify native bridge and capture screenshots
        run: |
          set -euo pipefail
          mkdir -p build/native-dock-preview
          app_data="$(xcrun simctl get_app_container "$SIMULATOR_UDID" com.slotsun.slive data)"
          report="$app_data/Documents/native-dock-preview.json"
          for attempt in $(seq 1 120); do
            if [ -f "$report" ]; then break; fi
            sleep 1
          done
          cp "$report" build/native-dock-preview/native-state.json
          python3 -c 'import json; r=json.load(open("build/native-dock-preview/native-state.json")); print(r); assert r["status"] == "success"'
          sleep 5
          xcrun simctl io "$SIMULATOR_UDID" screenshot build/native-dock-preview/light.png
          xcrun simctl ui "$SIMULATOR_UDID" appearance dark
          sleep 5
          xcrun simctl io "$SIMULATOR_UDID" screenshot build/native-dock-preview/dark.png

      - name: Upload native dock preview
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-dock-preview-${{ github.run_number }}
          path: simple_live_app/build/native-dock-preview/
          if-no-files-found: warn
          retention-days: 14
